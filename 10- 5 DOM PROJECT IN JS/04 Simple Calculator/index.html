<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="theme-color" content="#C6730D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculator">
</head>
<body>
    
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttonsContainer">
        <button onclick="clearDisplay()" class="clearBtn">C</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('0')" class="operator">0</button>
        <button onclick="appendValue('.')" class="operator">.</button>
        <button onclick="calculate()" class="equalTo">=</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
